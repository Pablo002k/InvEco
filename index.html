<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de precios</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  #estado { font-size: .9rem; opacity: .75; margin-bottom: 12px; }
  input { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
  .cols { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; margin-top: 12px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .lista { max-height: 460px; overflow: auto; border: 1px solid #8884; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #8883; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.f { cursor: pointer; } tr.f:hover { background: #8882; }
  #tv { height: 460px; border: 1px solid #8884; }
  #sel { margin: 0 0 8px; font-weight: 600; }
</style>
</head>
<body>
<h1>Prueba: precios de IOL + gráfico de TradingView</h1>
<div id="estado">Cargando…</div>
<input id="buscar" placeholder="Buscar por símbolo o nombre (ej: AAPL, SPY, GGAL)">
<div class="cols">
  <div class="lista"><table>
    <thead><tr><th>Símbolo</th><th>Tipo</th><th class="n">Último</th><th class="n">Var %</th></tr></thead>
    <tbody id="filas"></tbody></table></div>
  <div><p id="sel">Elegí un activo de la lista</p><div id="tv"></div></div>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let datos = [];
const $ = id => document.getElementById(id);

function pintar() {
  const q = $("buscar").value.trim().toLowerCase();
  const lista = datos.filter(d => !q || d.s.toLowerCase().includes(q) || d.nombre.toLowerCase().includes(q)).slice(0, 300);
  $("filas").innerHTML = lista.map(d =>
    `<tr class="f" data-s="${d.s}"><td>${d.s}</td><td>${d.tipo}</td>` +
    `<td class="n">${d.ultimo ?? "-"}</td><td class="n">${d.variacion_pct ?? "-"}</td></tr>`).join("");
}

function grafico(sim) {
  const d = datos.find(x => x.s === sim);
  $("sel").textContent = `${sim} — ${d.nombre} · IOL: ${d.ultimo} ${d.moneda}`;
  $("tv").innerHTML = "";
  new TradingView.widget({ container_id: "tv", symbol: "BCBA:" + sim, interval: "D",
    locale: "es", theme: "light", autosize: true, timezone: "America/Argentina/Buenos_Aires" });
}

fetch("data/precios.json?" + Date.now()).then(r => r.json()).then(j => {
  datos = Object.entries(j.precios).map(([s, v]) => ({ s, ...v })).sort((a, b) => a.s.localeCompare(b.s));
  if (!datos.length) { $("estado").textContent = "Todavía no hay precios: ejecutá primero la acción en GitHub."; return; }
  $("estado").textContent = `${datos.length} activos · actualizado ${new Date(j.actualizado).toLocaleString("es-AR")}`;
  pintar();
}).catch(() => { $("estado").textContent = "Todavía no hay precios: ejecutá primero la acción en GitHub."; });

$("buscar").addEventListener("input", pintar);
$("filas").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) grafico(tr.dataset.s); });
</script>
</body>
</html>
