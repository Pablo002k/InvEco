name: Actualizar precios

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Cuántos minutos seguirá actualizando (0 = una sola vez)"
        default: "180"
  schedule:
    # Lunes a viernes. Hora de Buenos Aires = UTC menos 3.
    # Primera ejecución: 10:03 hs de Argentina (dura 5 horas).
    - cron: "3 13 * * 1-5"
    # Segunda ejecución (relevo): 14:33 hs de Argentina (dura 4 horas, hasta pasadas las 18:30).
    - cron: "33 17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: true

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramienta de Firebase
        run: pip install -q firebase-admin

      - name: Traer precios de IOL y ejecutar órdenes
        run: python3 -u scripts/actualizar_precios.py
        env:
          IOL_USUARIO: ${{ secrets.IOL_USUARIO }}
          IOL_CLAVE: ${{ secrets.IOL_CLAVE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_CLAVE: ${{ secrets.FIREBASE_CLAVE }}
          MINUTOS: ${{ inputs.minutos || (github.event.schedule == '3 13 * * 1-5' && '300') || '240' }}
