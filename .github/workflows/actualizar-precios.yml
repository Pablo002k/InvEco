name: Actualizar precios

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: true

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer precios de IOL
        run: python3 scripts/actualizar_precios.py
        env:
          IOL_USUARIO: ${{ secrets.IOL_USUARIO }}
          IOL_CLAVE: ${{ secrets.IOL_CLAVE }}

      - name: Guardar el archivo de precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar precios"
            git pull --rebase
            git push
          fi
